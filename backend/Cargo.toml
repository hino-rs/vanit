[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
dashmap = "6.2.1"
anyhow = "1.0.104"
futures = "0.3.33"
serde_json = "1.0.151"
axum = { version = "0.8.9", features = ["ws"] }
uuid = { version = "1.24.0", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
tower-http = { version = "0.7.0", features = ["cors"] }
log = "0.4.33"
env_logger = "0.11.11"
