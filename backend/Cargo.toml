[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = "1.0.229"
futures = "0.3.33"
serde_json = "1.0.151"
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors"] }
anyhow = "1.0.104"
dashmap = "6.2.1"
uuid = { version = "1.24.0", features = ["v4"] }
